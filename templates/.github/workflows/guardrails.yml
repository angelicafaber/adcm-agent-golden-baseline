name: guardrails
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: angelicafaber/adcm-agent-golden-baseline/.github/actions/adcm-guardrails@4620afebe9efbea9ebb7fa39c1716433a5a3e44a # v1.0.0
        with:
          fail-on: high
